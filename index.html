<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cinecat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://www.marca.com/favicon.ico" type="image/x-icon">
</head>

<body>
    <header>
        <h1 id="titulo">Galeria de peliculas</h1>
        <p id="resumen"></p>
    </header>
    <section class="controles">
        <p class="resumen"></p>
        <input id="buscador" type="search" placeholder="Buscar...">
        <button id="ordenTitulo">0rdenar A-Z</button> 
        <button id="ordenDuracion">0rdenar por duracion</button>
        <button id="ordenEstreno">0rdenar por Estreno</button>
    </section>
    <p id="estadisticas"></p>
    <section>
    <h2>Añadir película</h2>

    <input type="text" id="nuevoTitulo" placeholder="Título">
    <input type="text" id="nuevoGenero" placeholder="Genero">
    <input type="text" id="nuevoDirector" placeholder="Director">
    <input type="number" id="nuevaDuracion" placeholder="Duración">
    <input type="date" id="nuevoEstreno">

    <button id="anadirPelicula">Añadir película</button>
</section>
    <main id="listado"></main>

    <script src="js/app.js" defer></script>
</body>

</html>
